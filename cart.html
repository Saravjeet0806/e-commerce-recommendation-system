<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Shop | Cart</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <div class="container">
    <h1>E-Shop</h1>
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="login.html">Login</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </nav>
  </div>
</header>

<main class="container">
  <h2>Your Shopping Cart</h2>
  <div id="cart-items"></div>
  <h3>Total: &#8377;<span id="total">0</span></h3>
  <button id="checkout-button" class="btn checkout-button" type="button" onclick="payWithRazorpay()">Pay with Razorpay</button>
  <p id="checkout-message" class="checkout-message"></p>

  <section class="recommended-section">
    <h3>You May Also Like</h3>
    <p id="cart-recommendation-copy" class="section-copy">Suggestions to complete your order.</p>
    <div id="cart-recommendations" class="product-grid"></div>
  </section>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="js/script.js"></script>

</body>
</html>
