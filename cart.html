<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Shop | Cart</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <div class="container">
    <div class="logo">
      <img src="images/logo.png" class="logo-img" alt="E-Shop logo">
    </div>

    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="cart.html">
        Cart (<span id="cart-count">0</span>)
      </a>

      <span id="guest-links">
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </span>

      <span id="user-links" style="display:none;">
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
      </span>

    </nav>
  </div>
</header>

<main class="container">
  <h2 style="margin-top: 20px;">
    Your Shopping Cart
</h2>

  <div id="cart-items"></div>

  <h3>Total: &#8377;<span id="total">0</span></h3>

  <button id="checkout-button" class="btn checkout-button" type="button" onclick="payWithRazorpay()">
    Pay with Razorpay
  </button>

  <p id="checkout-message" class="checkout-message"></p>

  <section class="recommended-section">
    <h3>You May Also Like</h3>
    <p id="cart-recommendation-copy" class="section-copy">
      Suggestions to complete your order.
    </p>
    <div id="cart-recommendations" class="product-grid"></div>
  </section>
</main>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script src="js/script.js"></script>

<!-- AUTH NAVBAR SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const user = localStorage.getItem("user");

    const guestLinks = document.getElementById("guest-links");
    const userLinks = document.getElementById("user-links");

    if (user) {

        if (guestLinks) guestLinks.style.display = "none";
        if (userLinks) userLinks.style.display = "inline";

        const logoutBtn = document.getElementById("logoutBtn");

        if (logoutBtn) {
            logoutBtn.addEventListener("click", async function (e) {
                e.preventDefault();

                try {
                    await fetch("/api/logout", {
                        method: "POST",
                        credentials: "include"
                    });
                } catch (err) {
                    console.log(err);
                }

                localStorage.removeItem("user");
                window.location.href = "login.html";
            });
        }
    }
});
</script>

</body>
</html>
