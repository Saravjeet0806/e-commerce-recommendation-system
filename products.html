<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E-Shop | Products</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
  <div class="container">
   <div class="logo">
      <img src="images/logo.png" class="logo-img" alt="E-Shop logo">
    </div>
   
    <nav class="navbar">
      <a href="index.html">Home</a>
      <a href="products.html">Products</a>

      <span id="guest-links">
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </span>

      <span id="user-links" style="display:none;">
        <a href="profile.html">Profile</a>
        <a href="#" id="logoutBtn">Logout</a>
      </span>

      <a href="cart.html">
        Cart (<span id="cart-count">0</span>)
      </a>
    </nav>
  </div>
</header>

<main class="container page-section">
  <h2>All Products</h2>
  <div class="catalog-toolbar">
    <input id="search" class="search-input" onkeyup="searchProducts()" placeholder="Search products...">
    <select id="category-filter" class="category-filter" onchange="applyProductFilters()">
      <option value="all">All Categories</option>
    </select>
  </div>
  <div id="products-container" class="product-grid"></div>
</main>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const user = localStorage.getItem("user");

    const guestLinks = document.getElementById("guest-links");
    const userLinks = document.getElementById("user-links");

    if (user) {

        guestLinks.style.display = "none";
        userLinks.style.display = "inline";

        document
        .getElementById("logoutBtn")
        .addEventListener("click", async function (e) {

            e.preventDefault();

            try {
                await fetch("/api/logout", {
                    method: "POST",
                    credentials: "include"
                });
            } catch (err) {
                console.log(err);
            }

            localStorage.removeItem("user");

            window.location.href = "login.html";
        });
    }
});
</script>

<script src="js/script.js"></script>

</body>
</html>
