<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Shop | Profile</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }

      section.hero {
        flex: 1;
      }

      .footer {
        margin-top: auto;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="logo">
          <img src="images/logo.png" class="logo-img" alt="E-Shop logo" />
        </div>

        <nav class="navbar">
          <a href="index.html">Home</a>
          <a href="products.html">Products</a>

          <span id="guest-links">
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
          </span>

          <span id="user-links" style="display: none">
            <a href="profile.html">Profile</a>
            <a href="#" id="logoutBtn">Logout</a>
          </span>

          <a href="cart.html"> Cart (<span id="cart-count">0</span>) </a>
        </nav>
      </div>
    </header>

    <section class="hero">
      <div class="container">
        <div class="auth-card">
          <h2>Profile</h2>

          <h3 id="userName">Name:</h3>

          <h3 id="userEmail">Email:</h3>

          <button class="btn" id="logoutBtn2">Logout</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="container">
        <p>&copy; 2026 E-Shop. All rights reserved.</p>
      </div>
    </footer>

    <script>
      async function loadProfile() {
        const response = await fetch("/api/profile", {
          credentials: "include",
        });

        const data = await response.json();

        if (!response.ok) {
          alert("Please login first");
          window.location.href = "login.html";
          return;
        }

        document.getElementById("userName").innerText = "Name: " + data.name;
        document.getElementById("userEmail").innerText = "Email: " + data.email;
      }

      async function logout() {
        await fetch("/api/logout", {
          method: "POST",
          credentials: "include",
        });

        localStorage.removeItem("user");
        window.location.href = "login.html";
      }

      document.getElementById("logoutBtn").addEventListener("click", logout);
      document.getElementById("logoutBtn2").addEventListener("click", logout);

      document.addEventListener("DOMContentLoaded", function () {
        const user = localStorage.getItem("user");

        const guestLinks = document.getElementById("guest-links");
        const userLinks = document.getElementById("user-links");

        if (user) {
          if (guestLinks) guestLinks.style.display = "none";
          if (userLinks) userLinks.style.display = "inline";
        }
      });

      loadProfile();
    </script>
  </body>
</html>
